services:
  whisperx-asr:
    # Build from source for development
    build:
      context: .
      dockerfile: Dockerfile

    container_name: whisperx-asr-api-dev
    restart: unless-stopped

    # GPU configuration
    # Uses GPU 0 by default. To pin to a different GPU, create
    # docker-compose.dev.local.yml (gitignored) with NVIDIA_VISIBLE_DEVICES.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ports:
      - "9000:9000"
      # Ray dashboard (ray mode only). Bound to localhost because jobs submitted
      # through it are executed as code in the container; see README
      # "Ray Dashboard Access".
      - "127.0.0.1:${RAY_DASHBOARD_PORT:-8265}:8265"

    shm_size: '8g'

    environment:
      # Suppress pyannote's torchcodec UserWarning in all processes (including Ray workers)
      - PYTHONWARNINGS=ignore::UserWarning
      # All values loaded from .env file
      - DEVICE=${DEVICE:-cuda}
      - COMPUTE_TYPE=${COMPUTE_TYPE:-float16}
      - ALIGN_DEVICE=${ALIGN_DEVICE:-}
      - BATCH_SIZE=${BATCH_SIZE:-16}
      - HF_TOKEN=${HF_TOKEN}
      - CACHE_DIR=${CACHE_DIR:-/.cache}
      - HF_HOME=${CACHE_DIR:-/.cache}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-}
      - NLTK_DATA=/.cache/nltk_data
      - PRELOAD_MODEL=${PRELOAD_MODEL:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-}
      - OPENAI_WHISPER1_MODEL=${OPENAI_WHISPER1_MODEL:-}
      - ALLOWED_MODELS=${ALLOWED_MODELS:-}
      - MAX_LOADED_MODELS=${MAX_LOADED_MODELS:-}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-1000}
      # Idle model eviction (0 disables; see README)
      - MODEL_KEEP_ALIVE_SECONDS=${MODEL_KEEP_ALIVE_SECONDS:-0}
      - MODEL_EVICTION_INTERVAL_SECONDS=${MODEL_EVICTION_INTERVAL_SECONDS:-60}
      # false skips the GPU cache cleanup after each transcription (lower latency)
      - CLEAR_GPU_AFTER_TRANSCRIBE=${CLEAR_GPU_AFTER_TRANSCRIBE:-true}
      - SERVE_MODE=${SERVE_MODE:-simple}
      - RAY_DASHBOARD_HOST=${RAY_DASHBOARD_HOST:-127.0.0.1}
      - PIPELINE_STRATEGY=${PIPELINE_STRATEGY:-replicate}
      - WHISPER_BATCH_SIZE=${WHISPER_BATCH_SIZE:-4}
      - ALIGN_BATCH_SIZE=${ALIGN_BATCH_SIZE:-8}
      - DIARIZE_BATCH_SIZE=${DIARIZE_BATCH_SIZE:-2}
      - BATCH_WAIT_TIMEOUT=${BATCH_WAIT_TIMEOUT:-0.1}
      - WHISPER_GPU_FRACTION=${WHISPER_GPU_FRACTION:-0.5}
      - ALIGN_GPU_FRACTION=${ALIGN_GPU_FRACTION:-0.3}
      - DIARIZE_GPU_FRACTION=${DIARIZE_GPU_FRACTION:-0.2}
      - NUM_GPU_REPLICAS=${NUM_GPU_REPLICAS:-1}
      - WHISPER_NUM_REPLICAS=${WHISPER_NUM_REPLICAS:-}
      - ALIGN_NUM_REPLICAS=${ALIGN_NUM_REPLICAS:-}
      - DIARIZE_NUM_REPLICAS=${DIARIZE_NUM_REPLICAS:-}
      - GPU_CONCURRENCY=${GPU_CONCURRENCY:-1}
      # Diarization hyperparameter tuning (optional; unset = community-1 defaults)
      - DIARIZE_CLUSTERING_THRESHOLD=${DIARIZE_CLUSTERING_THRESHOLD:-}
      - DIARIZE_MIN_DURATION_OFF=${DIARIZE_MIN_DURATION_OFF:-}
      - DIARIZE_PARAM_OVERRIDES=${DIARIZE_PARAM_OVERRIDES:-}
      - DIARIZE_FILL_NEAREST=${DIARIZE_FILL_NEAREST:-false}
      # Voice activity detection (optional; unset = WhisperX defaults)
      - VAD_METHOD=${VAD_METHOD:-}
      - VAD_ONSET=${VAD_ONSET:-}
      - VAD_OFFSET=${VAD_OFFSET:-}
      # Optional Qwen3-ASR backend (see README)
      - ASR_BACKEND=${ASR_BACKEND:-}
      - QWEN3_ASR_MODEL=${QWEN3_ASR_MODEL:-}
      - QWEN3_ALIGNER_MODEL=${QWEN3_ALIGNER_MODEL:-}
      - RESEGMENT_BY_SPEAKER=${RESEGMENT_BY_SPEAKER:-}
      # External ASR backend (ASR_BACKEND=external; see README)
      - EXTERNAL_ASR_BASE_URL=${EXTERNAL_ASR_BASE_URL:-}
      - EXTERNAL_ASR_API_KEY=${EXTERNAL_ASR_API_KEY:-}
      - EXTERNAL_ASR_MODEL=${EXTERNAL_ASR_MODEL:-}
      - EXTERNAL_ASR_MODE=${EXTERNAL_ASR_MODE:-}
      - EXTERNAL_ASR_ALIGNER=${EXTERNAL_ASR_ALIGNER:-}

    volumes:
      # Persistent cache for models (recommended)
      - whisperx-cache:/.cache

      # Mount local app directory for live code changes during development
      - ./app:/workspace/app
      - ./entrypoint.sh:/workspace/entrypoint.sh

    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:9000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whisperx-cache:
    driver: local
